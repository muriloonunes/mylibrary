<div>
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">Categorias</h1>
    </div>

    <div class="header-actions">
      <p-button label="Adicionar Categoria" icon="pi pi-plus" (onClick)="abrirDialogo()"></p-button>
    </div>
  </div>

  <p-dialog header="Adicionar Categoria" [modal]="true" [(visible)]="dialogoVisivel" (onHide)="fecharDialogo()"
            styleClass="dialog-cadastro">
    @if (categoriaCriada) {
      <form #criarCatForm="ngForm" (ngSubmit)="salvarCategoria()" class="form-container">

        <div class="form-group">
          <label for="nome" class="form-label">Nome*</label>
          <input type="text" id="nome" name="nome" pInputText
                 [(ngModel)]="categoriaCriada.nome"
                 placeholder="Ficção Científica"
                 #nomeVar="ngModel"
                 required
                 [ngClass]="{'ng-invalid ng-dirty': (nomeVar.invalid && (nomeVar.dirty || nomeVar.touched)) || erroBackend}">

          @if (nomeVar.invalid && (nomeVar.dirty || nomeVar.touched)) {
            <small class="error-message">O nome é obrigatório.</small>
          }
        </div>
        <div class="form-group mb-large">
          <label for="descricao" class="form-label">Descrição</label>
          <input type="text" id="descricao" name="descricao" pInputText
                 [(ngModel)]="categoriaCriada.descricao">
        </div>
        @if (erroBackend) {
          <small class="error-message server-error">{{ erroBackend }}</small>
        }
        <div class="form-actions">
          <p-button label="Cancelar" severity="secondary" type="button" (onClick)="fecharDialogo()"></p-button>
          <p-button label="Salvar" type="submit" [disabled]="criarCatForm.invalid"></p-button>
        </div>
      </form>
    }
  </p-dialog>
</div>
