<div class="page-header">
  <div class="header-content">
    <h1 class="page-title">Livros</h1>
    <p class="page-subtitle">{{ livros.length }} livros no acervo</p>
  </div>
  <div class="header-actions">
    <p-button label="Adicionar Livro" icon="pi pi-plus"></p-button>
  </div>
</div>

<div class="livros-grid">
  @for (livro of livros; track livro) {
    <div class="livro-card">
      <div class="livro-card-header">
        <p-tag [value]="livro.categoriaNome" [icon]="'pi pi-tag'" class="categoria-livro-tag"></p-tag>
        <p-tag [value]="statusLabels[livro.status]" [severity]="livro.status === 'DISPONIVEL' ? 'success': 'warn' "
               class="status-livro-tag"></p-tag>
      </div>

      <div class="livro-card-body">
        <div class="livro-card-image">
          <i class="pi pi-book"></i>
        </div>
        <div class="livro-card-content">
          <h3 class="livro-titulo">{{ livro.titulo }}</h3>
          <p class="livro-autor">{{ livro.autor }}</p>
          <span class="meta">ISBN {{ livro.isbn }} &bull; {{ livro.anoPublicacao }}</span>
        </div>
      </div>
      <div class="livro-card-footer">
        <p-button label="Ver Detalhes" styleClass="p-button-outlined p-button-secondary w-full"></p-button>
        <p-button
          icon="pi pi-trash"
          styleClass="p-button-danger p-button-text"
          pTooltip="Excluir livro"
          [disabled]="livro.status === 'EMPRESTADO'">
        </p-button>
      </div>
    </div>
  }

</div>
